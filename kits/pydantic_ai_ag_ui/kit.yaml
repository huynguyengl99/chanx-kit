name: pydantic-ai-ag-ui
title: Pydantic AI over AG-UI
description: >-
  Run a Pydantic AI agent over the AG-UI protocol on a chanx websocket: streamed
  text, tool calls and human-in-the-loop approvals, with the conversation kept
  server-side and replayed to a reconnecting client as MESSAGES_SNAPSHOT.
version: 0.2.0
tier: contrib
tags: [agent, ag-ui, pydantic-ai, streaming, approvals]
authors: ["Huy Nguyen <ndhgl99@gmail.com>"]

requires:
  - ag-ui
  - conversation-store

dependencies:
  - "chanx>=2.10.0,<3"
  - "pydantic-ai-slim[ag-ui]>=2.13"

optional:
  tests:
    requires:
      - chanx-testing
