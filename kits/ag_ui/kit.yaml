name: ag-ui
title: AG-UI
description: >-
  Serve the AG-UI agent-user interaction protocol over a websocket, so any
  AG-UI frontend works unchanged. Provider-agnostic: yield events from any agent.
  Optionally broadcasts a run to every connection on its thread, replaying it to
  one that joins part-way through.
version: 0.3.0
tier: core
tags: [agent, ag-ui, protocol, streaming]
authors: ["Huy Nguyen <ndhgl99@gmail.com>"]

dependencies:
  # 2.10.2 emits a discriminated union in the form AsyncAPI accepts;
  # earlier versions make the generated document invalid.
  - "chanx>=2.10.2,<3"
  - "ag-ui-protocol>=0.1.19"

optional:
  tests:
    requires:
      - chanx-testing
