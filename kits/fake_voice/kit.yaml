name: fake-voice
title: Fake voice
description: >-
  A transcriber and a synthesizer that need no provider and no key: speech is transcribed as a scripted sentence, text is spoken as a tone per word. For demos, UI work and CI. Install both, or one part with `--only stt` or `--only tts`.
version: 0.1.0
tier: core
tags: [audio, speech-to-text, text-to-speech, testing, demo]
authors: ["Huy Nguyen <ndhgl99@gmail.com>"]

requires:
  - audio-stream-in
  - audio-stream-out

implements: [transcriber@1, synthesizer@1]

dependencies:
  - "chanx>=2.10.2,<3"

# Installed together by default; `copit add @chanx-kit/fake-voice --only stt` keeps one.
parts:
  stt:
    include: [transcriber.py, tests/test_transcriber.py]
    requires: [audio-stream-in]
    implements: [transcriber@1]
  tts:
    include: [synthesizer.py, tests/test_synthesizer.py]
    requires: [audio-stream-out]
    implements: [synthesizer@1]

optional:
  tests:
    requires:
      - chanx-testing
