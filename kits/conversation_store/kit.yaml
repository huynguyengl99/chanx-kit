name: conversation-store
title: Conversation store
description: >-
  Persistence for an agent conversation, held as an opaque blob per thread so one
  backend serves every agent framework. Ships an in-memory default for demos and
  tests.
version: 0.1.0
tier: core
tags: [agent, persistence, history, storage]
authors: ["Huy Nguyen <ndhgl99@gmail.com>"]

dependencies:
  - "chanx>=2.10.0,<3"

optional:
  tests:
    requires:
      - chanx-testing
