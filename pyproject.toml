[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[dependency-groups]
dev = [
  "ag-ui-protocol>=0.1.19",
  "fakeredis>=2.26",
  "pydantic-ai-slim>=1.0",
  "pytest-asyncio>=1.2.0",
  "pytest-cov>=6.1.1,<7",
  "pytest-mock>=3.14.0,<4",
  "pytest>=8.3.5,<9"
]
dev-django = [
  "channels-redis>=4,<5",
  "chanx[channels]>=2.10.0",
  "daphne>=4.1.2,<5",
  "djangorestframework>=3.15",
  "djangorestframework-stubs>=3.15",
  "django-stubs[compatible-mypy]>=5.2",
  "pytest-django>=4.11.1,<5",
  "types-channels>=4.2.0.20250712",
  {include-group = "dev"}
]
dev-fastapi = [
  "chanx[fast_channels]>=2.10.0",
  "fast-channels[redis]>=1.0.2",
  "httpx>=0.27.0,<1",
  "uvicorn[standard]>=0.35.0",
  {include-group = "dev"}
]
docs = [
  "mkdocs-gen-files>=0.5",
  "mkdocs-literate-nav>=0.6",
  "mkdocs-material>=9.5",
  "mkdocs>=1.6",
  "mkdocstrings[python]>=0.27",
  {include-group = "registry"}
]
lint = [
  "pre-commit>=4.0",
  "mypy>=1.15.0",
  "pyright[nodejs]>=1.1.405",
  "ruff>=0.11.3,<0.12"
]
registry = [
  "copit>=0.6",
  "jsonschema>=4.21",
  "pyyaml>=6.0.0,<7",
  "types-jsonschema>=4.21",
  "types-pyyaml>=6.0"
]
test = [
  "coverage[toml]>=7.8.0,<8",
  "pytest-cov>=6.1.0,<7",
  "pytest>=8.3.5,<9",
  {include-group = "registry"}
]

[project]
authors = [{email = "ndhgl99@gmail.com", name = "Huy Nguyen"}]
classifiers = [
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
  "Topic :: Software Development :: Libraries :: Application Frameworks"
]
dependencies = [
  "chanx>=2.10.0,<3"
]
description = "Composable, copy-in WebSocket components for chanx. Kits are copied with copit; this package only reserves the name."
license = {file = "LICENSE"}
name = "chanx-kit"
readme = "README.md"
requires-python = ">=3.11,<4.0"
version = "0.1.0"

[project.optional-dependencies]
django = ["chanx[channels]>=2.10.0,<3"]
fastapi = ["chanx[fast_channels]>=2.10.0,<3"]

[project.urls]
Documentation = "https://github.com/huynguyengl99/chanx-kit#readme"
Homepage = "https://github.com/huynguyengl99/chanx-kit"
Repository = "https://github.com/huynguyengl99/chanx-kit"

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
update_changelog_on_bump = true
version_files = ["src/chanx_kit/__init__.py:__version__"]
version_scheme = "pep440"
version_provider = "pep621"

[tool.coverage]

[tool.coverage.run]
source = ["kits"]

[tool.hatch.build.targets.sdist]
include = ["src", "LICENSE", "README.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/chanx_kit"]

[tool.pytest]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
testpaths = ["tests", "kits"]

[tool.uv]
default-groups = ["dev", "dev-django", "dev-fastapi", "docs", "lint", "registry", "test"]
package = false
