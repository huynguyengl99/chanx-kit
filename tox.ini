[tox]
env_list =
    py{311,312,313}-fastapi
    py{311,312,313}-django
    registry
    docs
    lint
isolated_build = True

# tox is for running the whole matrix locally; CI drives uv directly (.github/workflows/ci.yml).

[testenv]
package = skip
runner = uv-venv-lock-runner
setenv =
    PYTHONPATH = {toxinidir}

[testenv:py{311,312,313}-fastapi]
dependency_groups = dev-fastapi, test
extras = fastapi
setenv =
    {[testenv]setenv}
    CHANX_KIT_BACKEND = fast_channels
commands =
    pytest kits tests {posargs}

[testenv:py{311,312,313}-django]
dependency_groups = dev-django, test
extras = django
setenv =
    {[testenv]setenv}
    CHANX_KIT_BACKEND = channels
    DJANGO_SETTINGS_MODULE = tests.django_settings
commands =
    pytest kits tests {posargs}

[testenv:registry]
dependency_groups = registry, test
commands =
    python scripts/registry.py check

[testenv:docs]
dependency_groups = docs, registry
extras = fastapi
setenv =
    {[testenv]setenv}
    DISABLE_MKDOCS_2_WARNING = true
commands =
    mkdocs build --strict

[testenv:lint]
dependency_groups = dev-fastapi, dev-django, lint, registry
extras = fastapi, django
commands =
    ruff check src kits scripts tests sandbox docs
    ruff format --check src kits scripts tests sandbox docs
    pyright
